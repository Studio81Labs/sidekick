services:
  backend:
    build:
      context: ../..
      dockerfile: apps/backend/Dockerfile
    environment:
      POKER_DATA_DIR: /app/data
      POKER_PARSER_PROVIDER: ${POKER_PARSER_PROVIDER:-ocr_cv}
      POKER_PARSER_LAYOUT_PROFILE: ${POKER_PARSER_LAYOUT_PROFILE:-fortuna_nations}
      POKER_EXTERNAL_PARSER_URL: ${POKER_EXTERNAL_PARSER_URL:-}
      POKER_EXTERNAL_PARSER_BEARER_TOKEN: ${POKER_EXTERNAL_PARSER_BEARER_TOKEN:-}
      POKER_EXTERNAL_REQUEST_TIMEOUT_SECONDS: ${POKER_EXTERNAL_REQUEST_TIMEOUT_SECONDS:-60}
      POKER_MAX_UPLOAD_BYTES: ${POKER_MAX_UPLOAD_BYTES:-10485760}
      POKER_MAX_DATASET_UPLOAD_BYTES: ${POKER_MAX_DATASET_UPLOAD_BYTES:-104857600}
      POKER_MAX_BACKUP_UPLOAD_BYTES: ${POKER_MAX_BACKUP_UPLOAD_BYTES:-104857600}
      POKER_DATA_LOCK_EXPORT_TIMEOUT_SECONDS: ${POKER_DATA_LOCK_EXPORT_TIMEOUT_SECONDS:-30}
      POKER_PROXY_SHARED_SECRET: ${POKER_PROXY_SHARED_SECRET:-}
      POKER_ADMIN_OCR_TEST_ENABLED: ${POKER_ADMIN_OCR_TEST_ENABLED:-false}
      POKER_ADMIN_OCR_TEST_TOKEN: ${POKER_ADMIN_OCR_TEST_TOKEN:-}
      POKER_MCP_ENABLED: ${POKER_MCP_ENABLED:-false}
      POKER_MCP_PUBLIC_URL: ${POKER_MCP_PUBLIC_URL:-}
      POKER_MCP_ALLOWED_ORIGINS: "${POKER_MCP_ALLOWED_ORIGINS:-[]}"
      POKER_MCP_READ_CALLS_PER_MINUTE: ${POKER_MCP_READ_CALLS_PER_MINUTE:-60}
      POKER_SENTRY_DSN: ${POKER_SENTRY_DSN:-}
      POKER_SENTRY_ENVIRONMENT: ${POKER_SENTRY_ENVIRONMENT:-local}
      POKER_SENTRY_RELEASE: ${POKER_SENTRY_RELEASE:-}
      POKER_SENTRY_ERROR_SAMPLE_RATE: ${POKER_SENTRY_ERROR_SAMPLE_RATE:-1}
      POKER_CORS_ORIGINS: '${POKER_CORS_ORIGINS:-["http://localhost:5173","http://localhost:8080"]}'
    ports:
      - "8000:8000"
    volumes:
      - poker-data:/app/data

  pwa:
    build:
      context: ../..
      dockerfile: apps/pwa/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-http://localhost:8000}
        VITE_SENTRY_DSN: ${VITE_SENTRY_DSN:-}
        VITE_SENTRY_ENVIRONMENT: ${VITE_SENTRY_ENVIRONMENT:-local}
        VITE_SENTRY_RELEASE: ${VITE_SENTRY_RELEASE:-}
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  poker-data:
