      when using weak keys.  The author has recommended that users of Blowfish move to newer algorithms
      such as AES. With the `cryptography` package it is recommended to use `Fernet` which is a secure implementation
      of AES in CBC mode with a 128-bit key.  Alternatively, keep using the `Cipher` class from the hazmat
      primitives but use the AES algorithm instead.
