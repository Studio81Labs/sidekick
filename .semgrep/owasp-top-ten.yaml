          r_id: 13365
          rv_id: 1413423
          rule_id: d8Ulkd
          version_id: O9TQ2nX
          url: https://semgrep.dev/playground/r/O9TQ2nX/yaml.github-actions.security.pull-request-target-code-checkout.pull-request-target-code-checkout
          origin: community
    patterns:
      - pattern-either:
          - pattern-inside: "on:\n  ...\n  pull_request_target: ...\n  ...\n...\n"
          - pattern-inside: "on: [..., pull_request_target, ...]

              ...

