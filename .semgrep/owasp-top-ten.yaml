        - A04:2025 - Cryptographic Failures
      bandit-code: B305
      references:
        - https://cryptography.io/en/latest/hazmat/primitives/symmetric-encryption/#insecure-modes
        - https://crypto.stackexchange.com/questions/20941/why-shouldnt-i-use-ecb-encryption
