  - id: python.cryptography.security.insecure-cipher-algorithms.insecure-cipher-algorithm-idea
    message:
      IDEA (International Data Encryption Algorithm) is a block cipher created in 1991.  It is an
      optional component of the OpenPGP standard. This cipher is susceptible to attacks when using weak
      keys.  It is recommended that you do not use this cipher for new applications. Use a strong symmetric
      cipher such as EAS instead. With the `cryptography` package it is recommended to use `Fernet` which
      is a secure implementation of AES in CBC mode with a 128-bit key.  Alternatively, keep using the `Cipher`
      class from the hazmat primitives but use the AES algorithm instead.
    metadata:
      source-rule-url: https://github.com/PyCQA/bandit/blob/d5f8fa0d89d7b11442fc6ec80ca42953974354c8/bandit/blacklists/calls.py#L98
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
