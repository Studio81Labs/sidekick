name: Build Backend & Export OpenAPI

on:
  workflow_call:
    inputs:
      artifact-retention-days:
        description: Retention for the generated OpenAPI artifact
        required: false
        type: number
        default: 1
      ref:
        description: Exact Git ref or SHA to export; defaults to the triggering commit
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install workspace contract tooling
        run: pnpm install --frozen-lockfile

      - name: Install backend contract dependencies
        run: python -m pip install -e apps/backend

      - name: Export OpenAPI document
        run: >-
          python packages/openapi/scripts/export_openapi.py
          --output "$RUNNER_TEMP/openapi.json"

      - name: Canonicalize OpenAPI document
        run: pnpm exec prettier --write --ignore-unknown "$RUNNER_TEMP/openapi.json"

      - name: Validate OpenAPI document
        run: node packages/openapi/scripts/validate-openapi.mjs "$RUNNER_TEMP/openapi.json"

      - name: Archive generated OpenAPI document
        run: tar -czf "$RUNNER_TEMP/openapi-spec.tgz" -C "$RUNNER_TEMP" openapi.json

      - name: Upload generated OpenAPI document
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-spec
          path: ${{ runner.temp }}/openapi-spec.tgz
          retention-days: ${{ inputs.artifact-retention-days }}
