name: Build Backend & Export OpenAPI

on:
  workflow_call:
    inputs:
      artifact-retention-days:
        description: Retention for the generated OpenAPI artifact
        required: false
        type: number
        default: 1
      ref:
        description: Exact Git ref or SHA to export; defaults to the triggering commit
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  export:
    name: "contract: emit + validate"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.ref || github.sha }}

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements-prod.txt

      - name: Install workspace contract tooling
        run: pnpm install --frozen-lockfile

      - name: Install backend contract dependencies
        run: |
          python -m pip install --require-hashes -r apps/backend/requirements-prod.txt
          python -m pip install --no-deps --no-build-isolation apps/backend
          python -m pip check

      - name: Export OpenAPI document
        run: >-
          python packages/openapi/scripts/export_openapi.py
          --output "$RUNNER_TEMP/openapi.json"

      - name: Canonicalize OpenAPI document
        run: pnpm exec prettier --write --ignore-unknown "$RUNNER_TEMP/openapi.json"

      - name: Validate OpenAPI document
        run: node packages/openapi/scripts/validate-openapi.mjs "$RUNNER_TEMP/openapi.json"

      - name: Archive generated OpenAPI document
        run: tar -czf "$RUNNER_TEMP/openapi-spec.tgz" -C "$RUNNER_TEMP" openapi.json

      - name: Upload generated OpenAPI document
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: openapi-spec
          path: ${{ runner.temp }}/openapi-spec.tgz
          retention-days: ${{ inputs.artifact-retention-days }}
