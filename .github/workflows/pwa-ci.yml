name: PWA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: "pwa: detect inputs"
    runs-on: ubuntu-latest
    outputs:
      pwa: ${{ steps.detect.outputs.pwa }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Detect PWA inputs
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            DIFF_BASE="$BASE_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            DIFF_BASE="$BEFORE_SHA"
          else
            DIFF_BASE=$(git rev-list --max-parents=0 "$HEAD_SHA")
          fi

          PWA_CHANGED=false
          while IFS= read -r changed_path; do
            case "$changed_path" in
              apps/pwa/* | packages/openapi/* | packages/openapi-client/* | package.json | pnpm-lock.yaml | pnpm-workspace.yaml | tsconfig.base.json | scripts/check-pwa-bundle.mjs | .github/workflows/_build-openapi.yml | .github/workflows/pwa-ci.yml)
                PWA_CHANGED=true
                break
                ;;
            esac
          done < <(git diff --name-only "$DIFF_BASE" "$HEAD_SHA")

          echo "pwa=$PWA_CHANGED" >> "$GITHUB_OUTPUT"

  prepare-openapi:
    name: "contract: openapi spec"
    needs: changes
    if: ${{ needs.changes.outputs.pwa == 'true' }}
    uses: ./.github/workflows/_build-openapi.yml

  validate:
    name: "pwa: test, build, and image"
    needs: [changes, prepare-openapi]
    if: ${{ needs.changes.outputs.pwa == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download generated OpenAPI document
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openapi-spec
          path: ${{ runner.temp }}/openapi-artifact

      - name: Verify generated OpenAPI document
        run: |
          mkdir -p "$RUNNER_TEMP/openapi-generated"
          tar -xzf "$RUNNER_TEMP/openapi-artifact/openapi-spec.tgz" -C "$RUNNER_TEMP/openapi-generated"
          cmp packages/openapi/openapi.json "$RUNNER_TEMP/openapi-generated/openapi.json"

      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level high

      - name: Test PWA architecture
        run: pnpm -C apps/pwa test --run src/app/sourceArchitecture.test.ts

      - name: Test application shell and edge worker
        if: ${{ !cancelled() }}
        run: >-
          pnpm -C apps/pwa test --run src/app worker.test.js
          --exclude src/app/sourceArchitecture.test.ts

      - name: Test analyzer workflows
        if: ${{ !cancelled() }}
        run: pnpm -C apps/pwa test --run src/pages

      - name: Test features, domains, and shared UI
        if: ${{ !cancelled() }}
        run: pnpm -C apps/pwa test --run src/features src/domains src/shared

      - name: Build PWA and audit bundle budgets
        if: ${{ !cancelled() }}
        run: pnpm pwa:performance

      - name: Build PWA image
        if: ${{ !cancelled() }}
        run: docker build -f apps/pwa/Dockerfile -t poker-hero-pwa:test .

  gate:
    name: "pwa: gate"
    needs: [changes, prepare-openapi, validate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require PWA validation when selected
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PWA_CHANGED: ${{ needs.changes.outputs.pwa }}
          ARTIFACT_RESULT: ${{ needs.prepare-openapi.result }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::PWA change detection did not complete successfully"
            exit 1
          fi
          if [ "$PWA_CHANGED" = "true" ] && { [ "$ARTIFACT_RESULT" != "success" ] || [ "$VALIDATION_RESULT" != "success" ]; }; then
            echo "::error::PWA contract artifact result was $ARTIFACT_RESULT and validation result was $VALIDATION_RESULT"
            exit 1
          fi
          if [ "$PWA_CHANGED" != "true" ] && { [ "$ARTIFACT_RESULT" != "skipped" ] || [ "$VALIDATION_RESULT" != "skipped" ]; }; then
            echo "::error::PWA contract and validation should be skipped when no PWA input changed"
            exit 1
          fi
          echo "PWA validation passed or was intentionally skipped."
