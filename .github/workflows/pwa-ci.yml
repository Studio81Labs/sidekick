name: PWA CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: PWA Changes
    runs-on: ubuntu-latest
    outputs:
      pwa: ${{ steps.detect.outputs.pwa }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect PWA inputs
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            DIFF_BASE="$BASE_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            DIFF_BASE="$BEFORE_SHA"
          else
            DIFF_BASE=$(git rev-list --max-parents=0 "$HEAD_SHA")
          fi

          PWA_CHANGED=false
          while IFS= read -r changed_path; do
            case "$changed_path" in
              apps/pwa/* | package.json | pnpm-lock.yaml | pnpm-workspace.yaml | scripts/check-pwa-bundle.mjs | .github/workflows/pwa-ci.yml)
                PWA_CHANGED=true
                break
                ;;
            esac
          done < <(git diff --name-only "$DIFF_BASE" "$HEAD_SHA")

          echo "pwa=$PWA_CHANGED" >> "$GITHUB_OUTPUT"

  validate:
    name: PWA Test & Build
    needs: changes
    if: ${{ needs.changes.outputs.pwa == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit production JavaScript dependencies
        run: pnpm audit --prod --audit-level high

      - name: Test PWA architecture
        run: pnpm -C apps/pwa test --run src/app/sourceArchitecture.test.ts

      - name: Test application shell and edge worker
        if: ${{ !cancelled() }}
        run: >-
          pnpm -C apps/pwa test --run src/app worker.test.js
          --exclude src/app/sourceArchitecture.test.ts

      - name: Test analyzer workflows
        if: ${{ !cancelled() }}
        run: pnpm -C apps/pwa test --run src/pages

      - name: Test features, domains, and shared UI
        if: ${{ !cancelled() }}
        run: pnpm -C apps/pwa test --run src/features src/domains src/shared

      - name: Build PWA and audit bundle budgets
        if: ${{ !cancelled() }}
        run: pnpm pwa:performance

      - name: Build PWA image
        if: ${{ !cancelled() }}
        run: docker build -f apps/pwa/Dockerfile -t poker-hero-pwa:test .

  gate:
    name: PWA Gate
    needs: [changes, validate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require PWA validation when selected
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          PWA_CHANGED: ${{ needs.changes.outputs.pwa }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::PWA change detection did not complete successfully"
            exit 1
          fi
          if [ "$PWA_CHANGED" = "true" ] && [ "$VALIDATION_RESULT" != "success" ]; then
            echo "::error::PWA validation result was $VALIDATION_RESULT"
            exit 1
          fi
          if [ "$PWA_CHANGED" != "true" ] && [ "$VALIDATION_RESULT" != "skipped" ]; then
            echo "::error::PWA validation should be skipped when no PWA input changed"
            exit 1
          fi
          echo "PWA validation passed or was intentionally skipped."
