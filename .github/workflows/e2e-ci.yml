name: Browser E2E

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "apps/pwa/**"
      - "packages/openapi/**"
      - "packages/openapi-client/**"
      - "scripts/e2e_provider_stub.py"
      - "scripts/start-e2e-backend.sh"
      - "scripts/ci/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/_build-openapi.yml"
      - ".github/workflows/e2e-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "apps/pwa/**"
      - "packages/openapi/**"
      - "packages/openapi-client/**"
      - "scripts/e2e_provider_stub.py"
      - "scripts/start-e2e-backend.sh"
      - "scripts/ci/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/_build-openapi.yml"
      - ".github/workflows/e2e-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prepare-openapi:
    name: "contract: openapi spec"
    uses: ./.github/workflows/_build-openapi.yml

  test:
    name: "e2e: browser workflow"
    needs: prepare-openapi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/requirements-prod.txt

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install --require-hashes -r apps/backend/requirements-prod.txt
          python -m pip install --no-deps --no-build-isolation apps/backend
          python -m pip check
          pnpm -C apps/pwa exec playwright install --with-deps chromium

      - name: Download generated OpenAPI document
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openapi-spec
          path: ${{ runner.temp }}/openapi-artifact

      - name: Verify generated API contract
        run: |
          mkdir -p "$RUNNER_TEMP/openapi-generated"
          tar -xzf "$RUNNER_TEMP/openapi-artifact/openapi-spec.tgz" -C "$RUNNER_TEMP/openapi-generated"
          cmp packages/openapi/openapi.json "$RUNNER_TEMP/openapi-generated/openapi.json"

      - name: Run browser workflow tests
        env:
          POKER_E2E_PYTHON: python
        run: pnpm test:e2e
