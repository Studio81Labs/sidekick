name: Browser E2E

on:
  push:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "apps/pwa/**"
      - "packages/openapi/**"
      - "packages/openapi-client/**"
      - "scripts/e2e_provider_stub.py"
      - "scripts/start-e2e-backend.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/_build-openapi.yml"
      - ".github/workflows/e2e-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "apps/backend/**"
      - "apps/pwa/**"
      - "packages/openapi/**"
      - "packages/openapi-client/**"
      - "scripts/e2e_provider_stub.py"
      - "scripts/start-e2e-backend.sh"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - ".github/workflows/_build-openapi.yml"
      - ".github/workflows/e2e-ci.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  prepare-openapi:
    name: Contract Artifact
    uses: ./.github/workflows/_build-openapi.yml

  test:
    name: Chromium workflow
    needs: prepare-openapi
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/backend/pyproject.toml

      - name: Install dependencies
        run: |
          pnpm install --frozen-lockfile
          python -m pip install -e apps/backend
          pnpm -C apps/pwa exec playwright install --with-deps chromium

      - name: Download generated OpenAPI document
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: openapi-spec
          path: ${{ runner.temp }}/openapi-artifact

      - name: Verify generated API contract
        run: |
          mkdir -p "$RUNNER_TEMP/openapi-generated"
          tar -xzf "$RUNNER_TEMP/openapi-artifact/openapi-spec.tgz" -C "$RUNNER_TEMP/openapi-generated"
          cmp packages/openapi/openapi.json "$RUNNER_TEMP/openapi-generated/openapi.json"

      - name: Run browser workflow tests
        env:
          POKER_E2E_PYTHON: python
        run: pnpm test:e2e
