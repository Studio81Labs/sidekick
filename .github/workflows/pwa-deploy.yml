name: PWA Deploy

# Builds the Vite SPA in apps/pwa and deploys it to Cloudflare Workers
# Static Assets.
#
# Deploy model:
#   push to main       -> staging
#   push tag v*        -> production
#   workflow_dispatch  -> choose staging or production
#
# Required repo secret:
#   CLOUDFLARE_API_TOKEN
#
# Required per-environment secret:
#   API_PROXY_SECRET          Shared with backend POKER_PROXY_SHARED_SECRET
#
# Required for staging and before enabling MCP elsewhere:
#   MCP_ADMIN_TOKEN           Unlocks MCP credential management at the Worker
#
# Required repo vars:
#   CLOUDFLARE_ACCOUNT_ID
#   APP_WORKERS_SUBDOMAIN      e.g. studio81 for *.studio81.workers.dev
#
# Required per-environment vars:
#   APP_WORKER_NAME           e.g. poker-staging or poker
#   BACKEND_URL                Backend origin proxied by the Worker, e.g. https://coolify-app.example.com
#
# Required for staging and any other environment with hosted MCP enabled:
#   MCP_SMOKE_URL              Exact public HTTPS /mcp URL
#
# Optional per-environment vars:
#   VITE_API_BASE_URL          Overrides the browser API base URL; defaults to same-origin in production
#   VITE_SENTRY_DSN            Enables privacy-scrubbed browser error reporting
#
# Optional per-environment secrets for smoke testing Cloudflare Access-protected URLs:
#   CLOUDFLARE_ACCESS_CLIENT_ID
#   CLOUDFLARE_ACCESS_CLIENT_SECRET

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "apps/pwa/**"
      - "packages/openapi/**"
      - "packages/openapi-client/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
      - "scripts/check-deployment.mjs"
      - "scripts/check-mcp-deployment.mjs"
      - "scripts/ci/**"
      - ".github/workflows/_build-openapi.yml"
      - ".github/workflows/_release-version-gate.yml"
      - ".github/workflows/pwa-deploy.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: ["staging", "production"]
        default: "staging"

permissions:
  contents: read

concurrency:
  group: pwa-deploy-${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
  cancel-in-progress: false

jobs:
  version-gate:
    name: "release: version gate"
    uses: ./.github/workflows/_release-version-gate.yml

  prepare-openapi:
    name: "contract: openapi spec"
    uses: ./.github/workflows/_build-openapi.yml

  deploy:
    name: "pwa: deploy and verify"
    needs: [version-gate, prepare-openapi]
    runs-on: ubuntu-latest
    environment:
      name: ${{ inputs.environment || (startsWith(github.ref, 'refs/tags/v') && 'production' || 'staging') }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download generated OpenAPI document
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: openapi-spec
          path: ${{ runner.temp }}/openapi-artifact

      - name: Verify generated API contract
        run: |
          mkdir -p "$RUNNER_TEMP/openapi-generated"
          tar -xzf "$RUNNER_TEMP/openapi-artifact/openapi-spec.tgz" -C "$RUNNER_TEMP/openapi-generated"
          cmp packages/openapi/openapi.json "$RUNNER_TEMP/openapi-generated/openapi.json"

      - name: Resolve environment
        id: env
        env:
          INPUT_ENV: ${{ inputs.environment || '' }}
          IS_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
        run: |
          if [ -n "$INPUT_ENV" ]; then
            ENV_NAME="$INPUT_ENV"
          elif [ "$IS_TAG" = "true" ]; then
            ENV_NAME="production"
          else
            ENV_NAME="staging"
          fi
          echo "name=${ENV_NAME}" >> "$GITHUB_OUTPUT"

      - name: Build PWA
        env:
          VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          VITE_SENTRY_ENVIRONMENT: ${{ steps.env.outputs.name }}
          VITE_SENTRY_RELEASE: ${{ github.sha }}
        run: pnpm pwa:build

      - name: Deploy to Cloudflare Workers
        id: deploy
        working-directory: apps/pwa
        env:
          ENV_NAME: ${{ steps.env.outputs.name }}
          WORKER_NAME: ${{ vars.APP_WORKER_NAME }}
          WORKERS_SUBDOMAIN: ${{ vars.APP_WORKERS_SUBDOMAIN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          API_PROXY_SECRET: ${{ secrets.API_PROXY_SECRET }}
          MCP_ADMIN_TOKEN: ${{ secrets.MCP_ADMIN_TOKEN }}
        run: |
          set -euo pipefail
          test -n "$WORKER_NAME" || { echo "::error::APP_WORKER_NAME var is not set in env ${ENV_NAME}"; exit 1; }
          test -n "$WORKERS_SUBDOMAIN" || { echo "::error::APP_WORKERS_SUBDOMAIN repo var is required"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "::error::CLOUDFLARE_ACCOUNT_ID repo var is required"; exit 1; }
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "::error::CLOUDFLARE_API_TOKEN repo secret is required"; exit 1; }
          test -n "$BACKEND_URL" || { echo "::error::BACKEND_URL var is not set in env ${ENV_NAME}"; exit 1; }
          test -n "$API_PROXY_SECRET" || { echo "::error::API_PROXY_SECRET secret is not set in env ${ENV_NAME}"; exit 1; }
          if [ "$ENV_NAME" = "staging" ]; then
            test -n "$MCP_ADMIN_TOKEN" || { echo "::error::MCP_ADMIN_TOKEN secret is not set in env ${ENV_NAME}"; exit 1; }
          fi
          if [ -n "$MCP_ADMIN_TOKEN" ] && [ "$MCP_ADMIN_TOKEN" = "$API_PROXY_SECRET" ]; then
            echo "::error::MCP_ADMIN_TOKEN must be different from API_PROXY_SECRET in env ${ENV_NAME}"
            exit 1
          fi
          node -e '
            const backend = new URL(process.env.BACKEND_URL);
            if (process.env.API_PROXY_SECRET && backend.protocol !== "https:") {
              console.error("::error::BACKEND_URL must use HTTPS when API_PROXY_SECRET is configured");
              process.exit(1);
            }
            const adminToken = process.env.MCP_ADMIN_TOKEN;
            if (adminToken && !/^[\x21-\x7e]{32,}$/.test(adminToken)) {
              console.error("::error::MCP_ADMIN_TOKEN must contain at least 32 printable ASCII characters without spaces");
              process.exit(1);
            }
          '

          SECRETS_FILE="${RUNNER_TEMP}/poker-worker-secrets.json"
          trap 'rm -f "$SECRETS_FILE"' EXIT
          node -e \
            'const secrets = {API_PROXY_SECRET: process.env.API_PROXY_SECRET}; if (process.env.MCP_ADMIN_TOKEN) secrets.MCP_ADMIN_TOKEN = process.env.MCP_ADMIN_TOKEN; require("node:fs").writeFileSync(process.argv[1], JSON.stringify(secrets))' \
            "$SECRETS_FILE"

          pnpm --workspace-root exec wrangler --version
          pnpm --workspace-root exec wrangler deploy \
            --config wrangler.jsonc \
            --name "$WORKER_NAME" \
            --var "BACKEND_URL:$BACKEND_URL" \
            --secrets-file "$SECRETS_FILE"

          DEPLOY_URL="https://${WORKER_NAME}.${WORKERS_SUBDOMAIN}.workers.dev"
          echo "url=${DEPLOY_URL}" >> "$GITHUB_OUTPUT"
          echo "::notice::PWA deployed to ${DEPLOY_URL}"

      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
          ENV_NAME: ${{ steps.env.outputs.name }}
          BACKEND_URL: ${{ vars.BACKEND_URL }}
          API_PROXY_SECRET: ${{ secrets.API_PROXY_SECRET }}
          CLOUDFLARE_ACCESS_CLIENT_ID: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_ID }}
          CLOUDFLARE_ACCESS_CLIENT_SECRET: ${{ secrets.CLOUDFLARE_ACCESS_CLIENT_SECRET }}
          MCP_ADMIN_TOKEN: ${{ secrets.MCP_ADMIN_TOKEN }}
          MCP_CONFIG_URL: ${{ steps.deploy.outputs.url }}/api/mcp/config
          MCP_SMOKE_URL: ${{ vars.MCP_SMOKE_URL }}
        run: |
          set -euo pipefail
          node -e '
            const url = new URL(process.env.URL);
            if (
              url.protocol !== "https:"
              || url.username
              || url.password
              || url.pathname !== "/"
              || url.search
              || url.hash
            ) {
              console.error("::error::Deployment smoke URL must be an exact HTTPS origin");
              process.exit(1);
            }
          '
          ACCESS_CURL_ARGS=()
          if [ -n "$CLOUDFLARE_ACCESS_CLIENT_ID" ] || [ -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET" ]; then
            test -n "$CLOUDFLARE_ACCESS_CLIENT_ID" && test -n "$CLOUDFLARE_ACCESS_CLIENT_SECRET" || {
              echo "::error::Cloudflare Access client ID and secret must be configured together"
              exit 1
            }
            ACCESS_CURL_ARGS+=(
              --header "CF-Access-Client-Id: $CLOUDFLARE_ACCESS_CLIENT_ID"
              --header "CF-Access-Client-Secret: $CLOUDFLARE_ACCESS_CLIENT_SECRET"
            )
          fi
          MCP_SMOKE_PRINCIPAL_ID=""
          # The EXIT trap below invokes this function indirectly.
          # shellcheck disable=SC2329
          cleanup_mcp_smoke_principal() {
            if [ -z "$MCP_SMOKE_PRINCIPAL_ID" ]; then
              return
            fi
            if curl --silent --show-error --fail-with-body \
              --connect-timeout 10 \
              --max-time 30 \
              --request DELETE \
              --header "Authorization: Bearer $MCP_ADMIN_TOKEN" \
              "${ACCESS_CURL_ARGS[@]}" \
              --output /dev/null \
              "$URL/api/mcp/principals/$MCP_SMOKE_PRINCIPAL_ID"; then
              echo "::notice::Revoked the ephemeral MCP smoke credential"
            else
              echo "::warning::Could not revoke the ephemeral MCP smoke credential; it expires within one hour"
            fi
          }
          trap cleanup_mcp_smoke_principal EXIT

          DEPLOYMENT_RESULT=$(node scripts/check-deployment.mjs "$URL" \
            --attempts 5 \
            --retry-delay-ms 5000 \
            --json)
          MCP_ENABLED=$(jq -er \
            '.mcp.enabled | if type == "boolean" then tostring else error("missing MCP enabled state") end' \
            <<<"$DEPLOYMENT_RESULT")

          if [ "$ENV_NAME" = "staging" ] || [ "$MCP_ENABLED" = "true" ]; then
            test -n "$MCP_SMOKE_URL" || {
              echo "::error::MCP_SMOKE_URL var is required for staging and every hosted MCP deployment"
              exit 1
            }
          fi
          if [ -n "$MCP_SMOKE_URL" ]; then
            test -n "$MCP_ADMIN_TOKEN" || {
              echo "::error::MCP_ADMIN_TOKEN is required when MCP_SMOKE_URL is configured"
              exit 1
            }
            MCP_SMOKE_EXPIRY=$(node -e \
              'process.stdout.write(new Date(Date.now() + 60 * 60 * 1000).toISOString())')
            MCP_SMOKE_REQUEST=$(jq -cn \
              --arg name "GitHub deployment smoke ${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
              --arg expires_at "$MCP_SMOKE_EXPIRY" \
              '{name: $name, scopes: ["read"], expires_at: $expires_at}')
            MCP_SMOKE_RESPONSE=$(curl --silent --show-error --fail-with-body \
              --connect-timeout 10 \
              --max-time 30 \
              --request POST \
              --header "Authorization: Bearer $MCP_ADMIN_TOKEN" \
              "${ACCESS_CURL_ARGS[@]}" \
              --header "Content-Type: application/json" \
              --data "$MCP_SMOKE_REQUEST" \
              "$URL/api/mcp/principals")
            MCP_SMOKE_PRINCIPAL_ID=$(jq -er '.principal.id' <<<"$MCP_SMOKE_RESPONSE")
            MCP_SMOKE_TOKEN=$(jq -er '.token' <<<"$MCP_SMOKE_RESPONSE")
            export MCP_SMOKE_TOKEN
          fi

          if [ -n "$MCP_SMOKE_URL" ]; then
            node scripts/check-mcp-deployment.mjs "$MCP_SMOKE_URL" "$ENV_NAME"
          fi

          # The template expression belongs to Node.js, not the shell.
          # shellcheck disable=SC2016
          DIRECT_API_URL=$(node -e '
            const backend = new URL(process.env.BACKEND_URL);
            const basePath = backend.pathname.replace(/\/+$/, "");
            backend.pathname = basePath.endsWith("/api")
              ? `${basePath}/jobs`
              : `${basePath}/api/jobs`;
            backend.search = "?limit=1";
            backend.hash = "";
            process.stdout.write(backend.href);
          ')
          for attempt in 1 2 3; do
            HTTP_CODE=$(curl -sS -o /dev/null -w '%{http_code}' "$DIRECT_API_URL" || echo '000')
            if [ "$HTTP_CODE" = "401" ]; then
              echo "::notice::Direct backend API correctly rejected an unauthenticated request"
              exit 0
            fi
            echo "Direct backend rejection attempt ${attempt}: HTTP=${HTTP_CODE}"
            sleep 5
          done
          echo "::error::Direct backend API did not return 401 without the Worker credential"
          exit 1
