name: OpenAPI Check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: OpenAPI Changes
    runs-on: ubuntu-latest
    outputs:
      contract: ${{ steps.detect.outputs.contract }}
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0

      - name: Detect contract inputs
        id: detect
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE_SHA: ${{ github.event.before }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "pull_request" ]; then
            DIFF_BASE="$BASE_SHA"
          elif [ -n "$BEFORE_SHA" ] && [ "$BEFORE_SHA" != "0000000000000000000000000000000000000000" ]; then
            DIFF_BASE="$BEFORE_SHA"
          else
            DIFF_BASE=$(git rev-list --max-parents=0 "$HEAD_SHA")
          fi

          CONTRACT_CHANGED=false
          while IFS= read -r changed_path; do
            case "$changed_path" in
              apps/backend/* | packages/openapi/* | packages/openapi-client/* | package.json | pnpm-lock.yaml | pnpm-workspace.yaml | tsconfig.base.json | .github/workflows/_build-openapi.yml | .github/workflows/openapi-check.yml)
                CONTRACT_CHANGED=true
                break
                ;;
            esac
          done < <(git diff --name-only "$DIFF_BASE" "$HEAD_SHA")

          echo "contract=$CONTRACT_CHANGED" >> "$GITHUB_OUTPUT"

  prepare-openapi:
    name: Contract Artifact
    needs: changes
    if: ${{ needs.changes.outputs.contract == 'true' }}
    uses: ./.github/workflows/_build-openapi.yml

  validate:
    name: OpenAPI Freshness
    needs: [changes, prepare-openapi]
    if: ${{ needs.changes.outputs.contract == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Download generated OpenAPI document
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.0
        with:
          name: openapi-spec
          path: ${{ runner.temp }}/openapi-artifact

      - name: Restore generated OpenAPI document
        run: |
          mkdir -p "$RUNNER_TEMP/openapi-generated"
          tar -xzf "$RUNNER_TEMP/openapi-artifact/openapi-spec.tgz" -C "$RUNNER_TEMP/openapi-generated"

      - name: Verify committed contract artifacts
        env:
          OPENAPI_SPEC_PATH: ${{ runner.temp }}/openapi-generated/openapi.json
        run: pnpm api:check:artifact

      - name: Typecheck generated client package
        run: pnpm api:typecheck

  gate:
    name: OpenAPI Gate
    needs: [changes, prepare-openapi, validate]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require contract validation when selected
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CONTRACT_CHANGED: ${{ needs.changes.outputs.contract }}
          ARTIFACT_RESULT: ${{ needs.prepare-openapi.result }}
          VALIDATION_RESULT: ${{ needs.validate.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::OpenAPI change detection did not complete successfully"
            exit 1
          fi
          if [ "$CONTRACT_CHANGED" = "true" ]; then
            if [ "$ARTIFACT_RESULT" != "success" ] || [ "$VALIDATION_RESULT" != "success" ]; then
              echo "::error::OpenAPI artifact result was $ARTIFACT_RESULT and validation result was $VALIDATION_RESULT"
              exit 1
            fi
          elif [ "$ARTIFACT_RESULT" != "skipped" ] || [ "$VALIDATION_RESULT" != "skipped" ]; then
            echo "::error::OpenAPI jobs should be skipped when no contract input changed"
            exit 1
          fi
          echo "OpenAPI validation passed or was intentionally skipped."
