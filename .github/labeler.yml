backend:
  - changed-files:
      - any-glob-to-any-file: "apps/backend/**"

pwa:
  - changed-files:
      - any-glob-to-any-file: "apps/pwa/**"

solver:
  - changed-files:
      - any-glob-to-any-file: "solver-plugins/**"

ci:
  - changed-files:
      - any-glob-to-any-file: ".github/workflows/**"

infra:
  - changed-files:
      - any-glob-to-any-file:
          - "infra/**"
          - "**/Dockerfile"
          - "**/Dockerfile.dockerignore"

docs:
  - changed-files:
      - any-glob-to-any-file:
          - "**/*.md"
          - "docs/**"
